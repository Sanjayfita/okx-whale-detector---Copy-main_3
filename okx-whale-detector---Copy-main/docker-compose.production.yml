name: okx-paper-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-research}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER} -d ${POSTGRES_DB:-research}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrations:
    image: postgres:16
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      PGDATABASE: ${POSTGRES_DB:-research}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/run-migrations.sh"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  platform:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
        APP_IMAGE_VERSION: ${APP_IMAGE_VERSION:-phase12-local}
    image: ${PLATFORM_IMAGE_NAME:-okx-whale-detector}:${APP_IMAGE_VERSION:-phase12-local}
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 4173
      TRADING_MODE: PAPER
      REMOTE_PAPER_ONLY: "true"
      PAPER_STARTING_EQUITY: ${PAPER_STARTING_EQUITY:-10000}
      PAPER_CHECKPOINT_INTERVAL_MS: ${PAPER_CHECKPOINT_INTERVAL_MS:-5000}
      PLATFORM_HEALTH_CHECK_INTERVAL_MS: ${PLATFORM_HEALTH_CHECK_INTERVAL_MS:-30000}
      PLATFORM_DATA_DIR: /app/data
      PAPER_STATE_PATH: /app/data/platform/paper-state.json
      TRADE_CONTEXT_PATH: /app/data/platform/trade-contexts.json
      APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
      APP_IMAGE_VERSION: ${APP_IMAGE_VERSION:-phase12-local}
      APP_CONFIGURATION_VERSION: ${APP_CONFIGURATION_VERSION:-phase12-v1}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TRADING_WEBHOOK_URL: ${TRADING_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      EMAIL_RELAY_URL: ${EMAIL_RELAY_URL:-}
      EMAIL_RECIPIENT: ${EMAIL_RECIPIENT:-}
      TZ: UTC
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-4173}:4173"
    volumes:
      - ${PLATFORM_DATA_DIR:?set PLATFORM_DATA_DIR in .env.production}:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    user: "${PLATFORM_UID:-1000}:${PLATFORM_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

volumes:
  postgres-data:
