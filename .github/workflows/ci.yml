name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'research/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d research_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: okx-whale-detector---Copy-main

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: okx-whale-detector---Copy-main/package-lock.json

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate research database migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in db/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h localhost -U postgres -d research_test -v ON_ERROR_STOP=1 -f "${migration}"
          done
          psql -h localhost -U postgres -d research_test -v ON_ERROR_STOP=1 -c "SELECT version, name FROM research.schema_migrations ORDER BY version"

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint, and test
        run: npm run check

      - name: Build
        run: npm run build

      - name: Validate dashboard in headless Chrome
        run: npx tsx src/tools/validateTradingDashboardBrowser.ts

      - name: Validate development Docker Compose deployment
        run: docker compose config --quiet

      - name: Validate production Docker Compose deployment
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet

      - name: Validate production operations scripts
        run: |
          sh -n ops/backup-production.sh
          sh -n ops/restore-production.sh
          sh -n ops/watchdog.sh
          sh -n ops/verify-backup-restore.sh
          sh ops/verify-backup-restore.sh
