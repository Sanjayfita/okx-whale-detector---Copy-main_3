name: Flatten repository once

on:
  push:
    branches:
      - agent/trading-platform-foundation
    paths:
      - '.github/workflows/flatten-repository-once.yml'

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/trading-platform-foundation
          fetch-depth: 0

      - name: Flatten application into repository root
        shell: bash
        run: |
          set -euo pipefail

          app='okx-whale-detector---Copy-main'

          test -d "$app"
          test -f "$app/package.json"
          test -f "$app/README.md"
          test -f '.github/workflows/ci.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Keep the active root .github directory. Remove only the obsolete nested one.
          if [ -d "$app/.github" ]; then
            git rm -r -- "$app/.github"
          fi

          # Remove the accidentally tracked command-text file.
          if git ls-files --error-unmatch "$app/tash drop stash@{0}" >/dev/null 2>&1; then
            git rm -- "$app/tash drop stash@{0}"
          fi

          # Replace the root placeholder README with the real application README.
          git rm -- README.md
          git mv -- "$app/README.md" README.md

          # Move every remaining tracked application file to the repository root.
          while IFS= read -r -d '' src; do
            rel="${src#${app}/}"
            dest="$rel"

            if [ -e "$dest" ]; then
              echo "Refusing to overwrite existing root path: $dest" >&2
              exit 1
            fi

            mkdir -p -- "$(dirname -- "$dest")"
            git mv -- "$src" "$dest"
          done < <(git ls-files -z -- "$app")

          # The active CI workflow now runs from repository root.
          sed -i 's#working-directory: okx-whale-detector---Copy-main#working-directory: .#g' .github/workflows/ci.yml
          sed -i 's#cache-dependency-path: okx-whale-detector---Copy-main/package-lock.json#cache-dependency-path: package-lock.json#g' .github/workflows/ci.yml

          # This workflow is intentionally single-use and must not survive the flatten commit.
          git rm -- .github/workflows/flatten-repository-once.yml

          # Structural assertions before committing.
          if git ls-files -- "$app" | grep -q .; then
            echo 'Tracked files still remain under the old nested directory:' >&2
            git ls-files -- "$app" >&2
            exit 1
          fi

          test -f package.json
          test -f package-lock.json
          test -f Dockerfile
          test -f docker-compose.yml
          test -f docker-compose.production.yml
          test -d src
          test -d test
          test -d web
          test -d docs
          test -d db
          test -d ops

          if grep -n 'okx-whale-detector---Copy-main' .github/workflows/ci.yml; then
            echo 'Active CI still contains an obsolete nested working-directory reference.' >&2
            exit 1
          fi

          git diff --check
          git status --short

          git add -A
          git commit -m 'refactor(repo): flatten application to repository root'
          git push origin HEAD:agent/trading-platform-foundation
