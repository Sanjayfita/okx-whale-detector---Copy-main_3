name: One-time repository flatten

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Detect whether flattening is still required
        id: detect
        shell: bash
        run: |
          if [ -d okx-whale-detector---Copy-main ]; then
            echo 'should_flatten=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_flatten=false' >> "$GITHUB_OUTPUT"
            echo 'Repository is already flattened; this one-shot workflow is a no-op.'
          fi

      - name: Flatten tracked project files into repository root
        if: steps.detect.outputs.should_flatten == 'true'
        shell: bash
        run: |
          set -euo pipefail
          inner='okx-whale-detector---Copy-main'

          test -f "$inner/package.json"
          test -f "$inner/package-lock.json"
          test -f "$inner/README.md"
          test -f '.github/workflows/ci.yml'

          # The outer README is only a placeholder. The maintained project README wins.
          git rm -- README.md

          # Delete the accidental tracked terminal/git-diff dump.
          if git ls-files --error-unmatch "$inner/tash drop stash@{0}" >/dev/null 2>&1; then
            git rm -- "$inner/tash drop stash@{0}"
          fi

          # Preserve the authoritative repository-root CI workflow and discard the
          # obsolete nested .github tree.
          while IFS= read -r -d '' file; do
            git rm -- "$file"
          done < <(git ls-files -z "$inner/.github/")

          # Move every remaining tracked application file to repository root.
          while IFS= read -r -d '' file; do
            destination="${file#${inner}/}"
            if [ "$destination" = "$file" ]; then
              echo "Could not strip nested project prefix from: $file" >&2
              exit 1
            fi
            if [ -e "$destination" ] || git ls-files --error-unmatch "$destination" >/dev/null 2>&1; then
              echo "Flattening collision at: $destination" >&2
              exit 1
            fi
            mkdir -p "$(dirname "$destination")"
            git mv -- "$file" "$destination"
          done < <(git ls-files -z "$inner/")

          if find "$inner" \( -type f -o -type l \) -print -quit | grep -q .; then
            echo 'Unexpected file remains in nested project after tracked moves:' >&2
            find "$inner" \( -type f -o -type l \) -print >&2
            exit 1
          fi
          find "$inner" -depth -type d -empty -delete

          test -f package.json
          test -f package-lock.json
          test -f README.md
          test -f Dockerfile
          test -f docker-compose.production.yml
          test -d src
          test -d test
          test -d web
          test -d docs
          test -d db
          test -d ops
          test ! -e "$inner"

          if git ls-files | grep -q '^okx-whale-detector---Copy-main/'; then
            echo 'Tracked files remain under the old nested project path.' >&2
            git ls-files | grep '^okx-whale-detector---Copy-main/' >&2
            exit 1
          fi
          if git ls-files | grep -Fq 'tash drop stash@{0}'; then
            echo 'Accidental stash-command file is still tracked.' >&2
            exit 1
          fi

          readme_count=$(git ls-files | awk 'tolower($0)=="readme.md" {count++} END {print count+0}')
          test "$readme_count" -eq 1

          echo 'Flattened tree prepared:'
          git status --short

      - name: Set up Node.js
        if: steps.detect.outputs.should_flatten == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.should_flatten == 'true'
        run: npm ci

      - name: Type-check, lint, and test
        if: steps.detect.outputs.should_flatten == 'true'
        run: npm run check

      - name: Build
        if: steps.detect.outputs.should_flatten == 'true'
        run: npm run build

      - name: Validate dashboard in headless Chrome
        if: steps.detect.outputs.should_flatten == 'true'
        run: npx tsx src/tools/validateTradingDashboardBrowser.ts

      - name: Validate Docker Compose files
        if: steps.detect.outputs.should_flatten == 'true'
        run: |
          docker compose config --quiet
          docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet

      - name: Validate production operations scripts
        if: steps.detect.outputs.should_flatten == 'true'
        run: |
          sh -n ops/backup-production.sh
          sh -n ops/restore-production.sh
          sh -n ops/watchdog.sh
          sh -n ops/preflight-production.sh
          sh -n ops/measure-resources.sh
          sh -n ops/deploy-production.sh
          sh -n ops/rollback-production.sh
          sh -n ops/verify-backup-restore.sh
          sh ops/verify-backup-restore.sh

      - name: Commit and push flattened application tree
        if: steps.detect.outputs.should_flatten == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows'
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing to push workflow-file changes from the one-shot token.' >&2
            exit 1
          fi
          git commit -m 'refactor(repo): flatten application to repository root'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
